name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build React app for Capacitor
        run: npm run build -- --mode capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore permanent Android signing key
        env:
          GYMTRACKER_KEYSTORE_BASE64: ${{ secrets.GYMTRACKER_KEYSTORE_BASE64 }}
          GYMTRACKER_KEYSTORE_PASSWORD: ${{ secrets.GYMTRACKER_KEYSTORE_PASSWORD }}
          GYMTRACKER_KEY_ALIAS: ${{ secrets.GYMTRACKER_KEY_ALIAS }}
          GYMTRACKER_KEY_PASSWORD: ${{ secrets.GYMTRACKER_KEY_PASSWORD }}
        run: |
          if [ -z "$GYMTRACKER_KEYSTORE_BASE64" ] || [ -z "$GYMTRACKER_KEYSTORE_PASSWORD" ] || [ -z "$GYMTRACKER_KEY_ALIAS" ] || [ -z "$GYMTRACKER_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. Follow APK_UPDATES.md once to configure update-safe signing."
            exit 1
          fi
          echo "$GYMTRACKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gymtracker-release.jks"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        env:
          GYMTRACKER_KEYSTORE_PATH: ${{ runner.temp }}/gymtracker-release.jks
          GYMTRACKER_KEYSTORE_PASSWORD: ${{ secrets.GYMTRACKER_KEYSTORE_PASSWORD }}
          GYMTRACKER_KEY_ALIAS: ${{ secrets.GYMTRACKER_KEY_ALIAS }}
          GYMTRACKER_KEY_PASSWORD: ${{ secrets.GYMTRACKER_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-apk
          path: android/app/build/outputs/apk/release/app-release.apk
